name: Deploy Almiron to VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: almiron-test-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALMIRON_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test static asset publishing
        run: |
          node --test scripts/audit-build-assets.test.mjs
          python3 scripts/test-deploy-vps.py

      - name: Build static site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_WEBHOOK_BASE_URL: ${{ vars.VITE_WEBHOOK_BASE_URL }}
          VITE_ASSETS_BASE_URL: ${{ vars.VITE_ASSETS_BASE_URL }}
          VITE_BUNNY_CDN_HOST: ${{ vars.VITE_BUNNY_CDN_HOST }}
          VITE_LANDING_V3: ${{ vars.VITE_LANDING_V3 }}

      - name: Verify the built dependency graph
        run: node scripts/audit-build-assets.mjs dist

      - name: Verify deployment and recovery scenarios
        run: |
          npm test -- src/lib/__tests__/perfAssetIngest.test.ts src/lib/__tests__/perfRum.test.ts src/lib/__tests__/releaseRecovery.test.ts src/hooks/__tests__/useVariantAttempt.submit.test.ts src/pages/student/__tests__/preflight-account-switch.test.tsx
          npx playwright install --with-deps chromium
          node --test scripts/test-deploy-browser.mjs

      - name: Configure SSH and verify VPS host key
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PRIVATE_KEY"
          install -m 700 -d "$RUNNER_TEMP/almiron-ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$RUNNER_TEMP/almiron-ssh/key"
          chmod 600 "$RUNNER_TEMP/almiron-ssh/key"
          ssh-keyscan -T 10 -t ed25519 45.84.227.23 > "$RUNNER_TEMP/almiron-ssh/known_hosts"
          actual="$(ssh-keygen -lf "$RUNNER_TEMP/almiron-ssh/known_hosts" -E sha256 | awk '{print $2}')"
          test "$actual" = 'SHA256:xDAxPUKVD20TWffiRqL/f5Y5OoHhjKTiF7OvcCZkC00'

      - name: Publish assets, activate, and verify or roll back
        run: |
          set -euo pipefail
          tar -czf site.tar.gz -C dist .
          options=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/almiron-ssh/known_hosts" -i "$RUNNER_TEMP/almiron-ssh/key")
          server=almiron-deploy@45.84.227.23
          remote="$(ssh "${options[@]}" "$server" 'mktemp -d /tmp/almiron-release.XXXXXXXX')"
          [[ "$remote" =~ ^/tmp/almiron-release\.[a-zA-Z0-9]+$ ]]
          trap 'ssh "${options[@]}" "$server" "rm -f -- $remote/site.tar.gz $remote/deploy-vps.py; rmdir -- $remote"' EXIT
          scp "${options[@]}" site.tar.gz scripts/deploy-vps.py "$server:$remote/"
          ssh "${options[@]}" "$server" "python3 $remote/deploy-vps.py deploy $ALMIRON_BUILD_ID $remote/site.tar.gz --check-url https://www.almiron.ru"
