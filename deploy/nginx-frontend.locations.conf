# Include inside the existing server block after replacing its SPA locations.
# The server-level mime.types include must cover js, css, json and wasm.
root /srv/almiron/current;
open_file_cache off;

location ^~ /assets/ {
    location ~ /\. { return 404; }
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    root /srv/almiron/shared;
    open_file_cache off;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /version.json {
    open_file_cache off;
    default_type application/json;
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
}

location = /index.html {
    open_file_cache off;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}

location / {
    try_files $uri /index.html;
}
